# Commit-time checks: lint and format, types, shell scripts, secrets
# Install: `pnpm install`, then `pre-commit install --allow-missing-config` (worktrees share .git/hooks)
repos:
  # Biome and tsc run from the project's own install, so their versions live only in package.json
  - repo: local
    hooks:
      # Lint with auto-fix, format, organize imports
      - id: biome-check
        name: biome check
        entry: pnpm exec biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|css|html|svg)$"

      # Type-check every project (root, site, service worker, tests, Worker) when a TypeScript, tsconfig or package.json file changes
      - id: typecheck
        name: typecheck
        entry: pnpm run typecheck
        language: system
        files: "\\.tsx?$|(^|/)tsconfig[^/]*\\.json$|(^|/)package\\.json$"
        pass_filenames: false

  # Lint shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck

  # Block committed secrets (API keys, tokens, private keys)
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
